<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="281" height="142" viewBox="0 0 281 142" role="img" aria-label="Sapl &amp; JMVM">
  <defs>
    <linearGradient id="sapl-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="jmvm-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#7e22ce"/>
    </linearGradient>
    <linearGradient id="link-grad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
  </defs>
  <!-- Same outer dimensions (281x142) and inner badge plate (x=14.2, y=26.7, 252.5x88.4) as Clean's logo.svg -->
  <rect x="14.2" y="26.7" width="252.5" height="88.4" rx="14" fill="#0f172a" stroke="#7dd3fc" stroke-opacity="0.55" stroke-width="2.5"/>

  <!-- Sapl icon + wordmark -->
  <rect x="21.5" y="48.9" width="44" height="44" rx="10.5" fill="url(#sapl-grad)"/>
  <path d="M34 59.5 L42.5 59.5 L52 82.5" fill="none" stroke="#ffffff" stroke-width="3.8" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M43.5 70 L35 82.5" fill="none" stroke="#ffffff" stroke-width="3.8" stroke-linecap="round"/>
  <circle cx="34" cy="59.5" r="2.5" fill="#e0f2fe"/>
  <circle cx="52" cy="82.5" r="2.5" fill="#e0f2fe"/>
  <circle cx="35" cy="82.5" r="2.5" fill="#e0f2fe"/>
  <text x="70" y="80" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="27.5" letter-spacing="-0.5" fill="#f8fafc">Sapl</text>

  <!-- Short flow chevron -->
  <path d="M130.5 65.5 L136 70.9 L130.5 76.3" fill="none" stroke="url(#link-grad)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- JMVM icon + wordmark -->
  <rect x="141" y="48.9" width="44" height="44" rx="10.5" fill="url(#jmvm-grad)"/>
  <rect x="150" y="58" width="18" height="5.2" rx="2" fill="#ffffff"/>
  <rect x="150" y="67" width="14" height="5.2" rx="2" fill="#f3e8ff"/>
  <rect x="150" y="76" width="20.5" height="5.2" rx="2" fill="#ffffff"/>
  <path d="M170 60.5 C177 60.5 177 78.5 173 78.5" fill="none" stroke="#e9d5ff" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M172 75.2 L175.5 78.5 L171 81.8" fill="none" stroke="#ffffff" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="189" y="79.5" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="22.5" letter-spacing="-0.3" fill="#f8fafc">JMVM</text>
</svg>
