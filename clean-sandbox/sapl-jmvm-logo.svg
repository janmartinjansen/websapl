<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="340" height="112" viewBox="0 0 340 112" role="img" aria-label="Sapl &amp; JMVM">
  <defs>
    <linearGradient id="sapl-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="jmvm-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#7e22ce"/>
    </linearGradient>
    <linearGradient id="link-grad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
  </defs>
  <!-- Visible pill spans y=12..100 (88 units, ~31.4px at 40px img height), matching Clean's badge presence -->
  <rect x="6" y="12" width="328" height="88" rx="16" fill="#0f172a" stroke="#7dd3fc" stroke-opacity="0.55" stroke-width="2.5"/>

  <!-- Sapl icon + wordmark -->
  <rect x="16" y="28" width="56" height="56" rx="13" fill="url(#sapl-grad)"/>
  <path d="M32 42 L43 42 L55 70" fill="none" stroke="#ffffff" stroke-width="4.6" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M44 55 L33 70" fill="none" stroke="#ffffff" stroke-width="4.6" stroke-linecap="round"/>
  <circle cx="32" cy="42" r="3.2" fill="#e0f2fe"/>
  <circle cx="55" cy="70" r="3.2" fill="#e0f2fe"/>
  <circle cx="33" cy="70" r="3.2" fill="#e0f2fe"/>
  <text x="78" y="68" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="36" letter-spacing="-0.8" fill="#f8fafc">Sapl</text>

  <!-- Flow arrow -->
  <line x1="156" y1="56" x2="169" y2="56" stroke="url(#link-grad)" stroke-width="3.2" stroke-linecap="round"/>
  <path d="M165 50 L171 56 L165 62" fill="none" stroke="#c084fc" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- JMVM icon + wordmark -->
  <rect x="177" y="28" width="56" height="56" rx="13" fill="url(#jmvm-grad)"/>
  <rect x="188" y="39.5" width="23" height="6.5" rx="2.6" fill="#ffffff"/>
  <rect x="188" y="51" width="17.5" height="6.5" rx="2.6" fill="#f3e8ff"/>
  <rect x="188" y="62.5" width="26" height="6.5" rx="2.6" fill="#ffffff"/>
  <path d="M213.5 42.5 C222.5 42.5 222.5 66 217 66" fill="none" stroke="#e9d5ff" stroke-width="3" stroke-linecap="round"/>
  <path d="M216 61.5 L220.5 66 L215 70" fill="none" stroke="#ffffff" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="238" y="67" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="29.5" letter-spacing="-0.8" fill="#f8fafc">JMVM</text>
</svg>
