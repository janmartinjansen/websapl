  <text x="61" y="37" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="27" letter-spacing="-0.5" fill="#0f172a">Sapl</text>

  <!-- Flow connector -->
  <line x1="130" y1="28" x2="160" y2="28" stroke="url(#link-grad)" stroke-width="2.8" stroke-linecap="round"/>
