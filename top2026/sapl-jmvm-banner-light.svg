<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="390" height="66" viewBox="0 0 390 66" role="img" aria-label="Sapl &amp; JMVM">
  <defs>
    <linearGradient id="sapl-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="jmvm-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#7e22ce"/>
    </linearGradient>
    <linearGradient id="link-grad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#7e22ce"/>
    </linearGradient>
  </defs>
  <!-- Sapl -->
  <rect x="4" y="7" width="52" height="52" rx="13" fill="url(#sapl-grad)"/>
  <path d="M20 20 L30 20 L41 46" fill="none" stroke="#ffffff" stroke-width="4.2" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M31 32 L21 46" fill="none" stroke="#ffffff" stroke-width="4.2" stroke-linecap="round"/>
  <circle cx="20" cy="20" r="2.8" fill="#e0f2fe"/>
  <circle cx="41" cy="46" r="2.8" fill="#e0f2fe"/>
  <circle cx="21" cy="46" r="2.8" fill="#e0f2fe"/>
  <text x="68" y="39" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="27" letter-spacing="-0.5" fill="#0f172a">Sapl</text>
  <text x="69" y="54" font-family="'Fira Code', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" fill="#475569">language</text>

  <!-- Flow connector -->
  <line x1="143" y1="33" x2="177" y2="33" stroke="url(#link-grad)" stroke-width="3" stroke-linecap="round"/>
  <path d="M172 27 L179 33 L172 39" fill="none" stroke="#7e22ce" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- JMVM -->
  <rect x="192" y="7" width="52" height="52" rx="13" fill="url(#jmvm-grad)"/>
  <rect x="203" y="18" width="21" height="6" rx="2.5" fill="#ffffff"/>
  <rect x="203" y="28" width="16" height="6" rx="2.5" fill="#f3e8ff"/>
  <rect x="203" y="38" width="24" height="6" rx="2.5" fill="#ffffff"/>
  <path d="M226 21 C234 21 234 41 229 41" fill="none" stroke="#e9d5ff" stroke-width="2.8" stroke-linecap="round"/>
  <path d="M228 37 L232 41 L227 45" fill="none" stroke="#ffffff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="256" y="39" font-family="'Fira Code', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-weight="800" font-size="26" letter-spacing="0.5" fill="#0f172a">JMVM</text>
  <text x="257" y="54" font-family="'Fira Code', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" fill="#475569">virtual machine</text>
